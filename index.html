<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Graze</title>
<meta name="description" content="Neon Graze: get close, get points, don't crash. A neon 3D dodge runner across 6 worlds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rubik:ital,wght@0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
:root{
  --ink:#fff; --soft:rgba(255,255,255,.72); --dim:rgba(255,255,255,.45);
  --glass:rgba(14,8,34,.5); --line:rgba(255,255,255,.16); --hot:#ff3d7f; --gold:#ffd23f; --accent:#ff3d7f;
  --bg:#0a0618; color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0618}}
:root[data-theme="dark"]{--bg:#0a0618}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#wrap{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.mono{font-family:'Chakra Petch',monospace}

/* HUD */
.hud{position:absolute;left:0;right:0;top:10px;padding:0 16px;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s}
.hud.on{opacity:1}
.hrow{display:flex;justify-content:space-between;align-items:flex-start}
.score{font-family:'Chakra Petch',monospace;font-weight:700;font-size:42px;line-height:1;text-shadow:0 0 18px rgba(255,255,255,.4)}
.score small{display:block;font-size:11px;letter-spacing:3px;color:var(--soft);font-weight:500;margin-top:3px}
.hright{text-align:right;font-family:'Chakra Petch',monospace}
.gems{font-weight:700;font-size:20px;color:var(--gold);text-shadow:0 0 12px rgba(255,210,63,.7)}
.combo{margin-top:4px;font-weight:700;font-size:28px;color:var(--accent);text-shadow:0 0 16px var(--accent);opacity:0;transition:opacity .2s;transform-origin:right center}
.combo.on{opacity:1}.combo.pump{animation:pump .25s ease}
@keyframes pump{40%{transform:scale(1.35)}}
.prog{margin-top:10px;display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--accent),#fff);box-shadow:0 0 10px var(--accent)}
.prog span{font-family:'Chakra Petch',monospace;font-size:11px;letter-spacing:2px;color:var(--soft);white-space:nowrap}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:4;opacity:0}
.banner b{display:block;font-family:'Chakra Petch',monospace;font-size:13px;letter-spacing:7px;color:var(--soft)}
.banner span{display:block;font-weight:900;font-style:italic;font-size:clamp(34px,11vw,56px);letter-spacing:1px;line-height:1;text-shadow:0 0 28px currentColor;margin:4px 0 8px}
.banner em{display:inline-block;font-style:normal;font-size:14px;font-weight:700;background:var(--glass);border:1px solid var(--line);padding:6px 14px;border-radius:999px;backdrop-filter:blur(6px)}
.banner.show{animation:ban 3s ease both}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}12%,78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-24px)}}
#pops{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.pop{position:absolute;font-family:'Chakra Petch',monospace;font-weight:700;font-size:19px;white-space:nowrap;transform:translate(-50%,-50%);animation:popup .9s ease-out forwards;text-shadow:0 0 12px currentColor}
@keyframes popup{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{transform:translate(-50%,-80%) scale(1.15);opacity:1}100%{transform:translate(-50%,-190%);opacity:0}}
.newob{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:'Chakra Petch',monospace;font-weight:700;font-size:16px;letter-spacing:3px;white-space:nowrap;padding:8px 16px;border-radius:999px;background:var(--glass);border:1.5px solid var(--accent);box-shadow:0 0 18px var(--accent);backdrop-filter:blur(6px);animation:newob 2.4s ease both}
.newob b{color:var(--accent);margin-right:8px}
@keyframes newob{0%{opacity:0;transform:translate(-50%,-12px) scale(.8)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pus{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.pus span{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--glass);border:1.5px solid var(--c);box-shadow:0 0 12px var(--c)}
.pus i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-family:'Chakra Petch',monospace;font-size:10px;font-weight:700;background:var(--c);color:#000;border-radius:8px;padding:0 4px}
.odwrap{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:10px;pointer-events:none;opacity:0;transition:opacity .3s}
.hud.on ~ .odwrap{opacity:1}
.hud.on ~ #mute{opacity:0;pointer-events:none}
.odbar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-right:56px}
.odbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a00,#ffd23f);box-shadow:0 0 10px #ffb02e;border-radius:5px;transition:width .2s}
.odwrap.live .odbar i{background:linear-gradient(90deg,#fff27a,#ffffff)}
.odbtn{position:absolute;right:0;bottom:-6px;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff3a0,#ff9a00 60%,#c24a00);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px rgba(255,255,255,.25),0 0 26px #ff9a00;pointer-events:none;opacity:.25;filter:grayscale(1);transform:scale(.8);transition:all .25s}
.odbtn b{font-size:7px;letter-spacing:1px;font-family:'Chakra Petch',monospace;color:#3a1600}
.odbtn.ready{pointer-events:auto;opacity:1;filter:none;transform:scale(1);animation:odp .8s ease-in-out infinite}
@keyframes odp{50%{transform:scale(1.1);box-shadow:0 0 0 6px rgba(255,210,63,.35),0 0 40px #ffb02e}}
.tip{position:absolute;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);z-index:7;width:min(340px,88vw);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;
  background:rgba(14,8,34,.82);border:1.5px solid var(--accent);box-shadow:0 0 22px rgba(0,0,0,.4);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:all .35s}
.tip.show{opacity:1;transform:translate(-50%,0)}
.tip .ti{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.tip b{display:block;font-weight:900;font-size:16px}.tip span{display:block;font-size:13px;color:var(--soft);line-height:1.3}
.tip .hand{position:absolute;left:50%;top:115%;font-size:34px;animation:handsw 1.4s ease-in-out infinite}
@keyframes handsw{0%,100%{transform:translateX(-60px)}50%{transform:translateX(60px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
.vign{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.55))}

/* screens */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s}
.screen.show{opacity:1;pointer-events:auto}
.logo{font-weight:900;font-style:italic;font-size:clamp(60px,19vw,104px);line-height:.82;letter-spacing:-4px;
  background:linear-gradient(180deg,#fff 15%,#ffc2dc 50%,#ff3d7f 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,61,127,.6))}
.tagl{font-family:'Chakra Petch',monospace;letter-spacing:6px;font-size:12px;color:var(--soft);margin:14px 0 28px}
.btn{border:0;border-radius:20px;padding:15px 0;width:min(280px,80vw);font-weight:900;font-size:19px;letter-spacing:2px;margin-bottom:12px;
  background:linear-gradient(135deg,#ff74a8,#ff3d7f);box-shadow:0 6px 0 #a3134a,0 0 30px rgba(255,61,127,.55)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3134a}
.btn.alt{background:var(--glass);border:1.5px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.4);backdrop-filter:blur(8px)}
.btn small{display:block;font-family:'Chakra Petch',monospace;font-size:11px;letter-spacing:2px;font-weight:500;color:var(--soft);margin-top:2px}
.link{background:none;border:0;color:var(--soft);margin-top:12px;font-size:14px;text-decoration:underline}
.credit{margin-top:14px;font-family:'Chakra Petch',monospace;font-size:12px;letter-spacing:2px;color:var(--dim);text-decoration:none}
.wallet{font-family:'Chakra Petch',monospace;color:var(--gold);font-size:15px;margin-top:6px}
.title2{font-weight:900;font-style:italic;font-size:30px;letter-spacing:1px;margin:0 0 4px}
.sub2{font-family:'Chakra Petch',monospace;font-size:12px;letter-spacing:3px;color:var(--soft);margin-bottom:16px}
.stages{display:flex;flex-direction:column;gap:10px;width:min(380px,100%);max-height:62vh;overflow-y:auto;padding:4px}
.st{position:relative;display:flex;align-items:center;gap:12px;border:0;border-radius:20px;padding:14px;text-align:left;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.st::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 70%);pointer-events:none}
.st .num{position:relative;z-index:1;font-family:'Chakra Petch',monospace;font-weight:700;font-size:30px;width:44px;text-align:center;text-shadow:0 0 12px rgba(255,255,255,.6)}
.st .info{position:relative;z-index:1;flex:1}
.st .info b{display:block;font-weight:900;font-style:italic;font-size:19px;letter-spacing:.5px}
.st .info span{font-size:12px;color:rgba(255,255,255,.85)}
.st .stars{position:relative;z-index:1;font-size:16px;letter-spacing:1px;color:var(--gold);text-shadow:0 0 8px rgba(255,210,63,.7)}
.st.locked{filter:grayscale(.85) brightness(.55)}
.st.locked .stars{color:#fff}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(340px,100%)}
.skin{aspect-ratio:1/1.15;border-radius:18px;border:2px solid var(--line);background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;backdrop-filter:blur(6px)}
.skin i{width:32px;height:32px;border-radius:50%}
.skin span{font-family:'Chakra Petch',monospace;font-size:11px;color:var(--gold)}
.skin.on{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.45)}
.skin.locked i{filter:grayscale(1) brightness(.45)}
.hold{position:relative;width:90px;height:90px;border-radius:50%;margin:10px auto 8px;display:grid;place-items:center}
.hold::before,.hold::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ring 1.8s ease-out infinite}
.hold::after{animation-delay:.9s}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.3);opacity:0}}
.hold i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff7aa8 45%,#ff3d7f);box-shadow:0 0 22px #ff3d7f;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-24px)}50%{transform:translateX(24px)}}
.ready .hint{font-weight:700;font-size:18px}.ready .hint small{display:block;font-weight:500;font-size:13px;color:var(--soft);margin-top:6px}
.res h2{font-weight:900;font-style:italic;font-size:26px;letter-spacing:4px;margin:0 0 6px}
.big{font-family:'Chakra Petch',monospace;font-weight:700;font-size:70px;line-height:1;text-shadow:0 0 26px rgba(255,255,255,.45)}
.bigstars{font-size:44px;letter-spacing:6px;margin:6px 0}
.bigstars i{font-style:normal;display:inline-block;color:rgba(255,255,255,.18)}
.bigstars i.on{color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.9);animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
.bigstars i:nth-child(2){animation-delay:.25s}.bigstars i:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.newbest{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:var(--gold);color:#3a2600;font-weight:900;font-size:13px;letter-spacing:2px;animation:pump .6s ease infinite alternate}
.pbar{width:min(300px,80vw);height:10px;border-radius:6px;background:rgba(255,255,255,.14);margin:10px auto 4px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#fff);border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 22px;width:min(340px,100%)}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px 6px;backdrop-filter:blur(6px)}
.stat b{display:block;font-family:'Chakra Petch',monospace;font-size:21px}
.stat span{font-size:11px;color:var(--soft);letter-spacing:1px}
.corner{position:absolute;z-index:12;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:18px;backdrop-filter:blur(6px);display:grid;place-items:center;padding:0}
#mute{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#pause{right:14px;top:calc(88px + env(safe-area-inset-top,0px));display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="vign"></div>
  <div class="hud" id="hud">
    <div class="hrow">
      <div class="score"><span id="sc">0</span><small>SCORE</small></div>
      <div class="hright"><div class="gems">◆ <span id="gm">0</span></div><div class="combo" id="combo">x2</div><div class="pus" id="pus"></div></div>
    </div>
    <div class="prog" id="prog"><span id="stName">STAGE 1</span><div class="bar"><i id="pfill"></i></div><span id="pct">0%</span></div>
  </div>
  <div class="odwrap" id="odwrap"><div class="odbar"><i id="odfill"></i></div><button class="odbtn" id="odbtn" aria-label="Overdrive">🔥<b>OVERDRIVE</b></button></div>
  <div class="tip" id="tip"></div>
  <div class="banner" id="banner"><b id="banTop">STAGE 1</b><span id="banName"></span><em id="banHint"></em></div>
  <div id="pops"></div>
  <div class="flash" id="flash"></div>

  <div class="screen show" id="menu">
    <div class="logo">NEON<br>GRAZE</div>
    <div class="tagl">GET CLOSE · GET POINTS · DON'T CRASH</div>
    <button class="btn" id="bPlay">PLAY<small id="bPlaySub">STAGE 1</small></button>
    <button class="btn alt" id="bEndless">ENDLESS<small id="bEndSub">BEST 0</small></button>
    <button class="btn alt" id="bSkins">ORBS<small id="bSkinSub">◆ 0</small></button>
    <a class="credit" href="https://x.com/liamxbtt" target="_blank" rel="noopener">made by @liamxbtt</a>
  </div>
  <div class="screen" id="map"><div class="title2">SELECT WORLD</div><div class="sub2" id="mapSub"></div><div class="stages" id="stages"></div><button class="link" data-back>Back</button></div>
  <div class="screen" id="skinsS"><div class="title2">ORBS</div><div class="sub2">COLLECT GEMS TO UNLOCK</div><div class="skins" id="skins"></div><div class="wallet" id="wallet"></div><button class="link" data-back>Back</button></div>
  <div class="screen ready" id="ready"><div class="hold"><i></i></div><div class="hint">Hold &amp; slide<small>Brush close past obstacles to build combos</small></div></div>
  <div class="screen res" id="clear">
    <h2 style="color:var(--gold)">WORLD CLEAR</h2>
    <div class="bigstars" id="cStars"></div>
    <div class="big" id="cScore">0</div>
    <div class="stats"><div class="stat"><b id="cGems">0</b><span>GEMS</span></div><div class="stat"><b id="cGraze">0</b><span>GRAZES</span></div><div class="stat"><b id="cCombo">x1</b><span>MAX COMBO</span></div></div>
    <button class="btn" id="cNext">NEXT WORLD</button><button class="link" id="cMap">World select</button>
  </div>
  <div class="screen res" id="fail">
    <h2 style="color:var(--hot)">CRASHED</h2>
    <div class="big" id="fScore">0</div><div id="fNb"></div>
    <div class="pbar" id="fBarW"><i id="fBar"></i></div><div class="mono" id="fPct" style="font-size:13px;color:var(--soft);letter-spacing:2px"></div>
    <div class="stats"><div class="stat"><b id="fBest">0</b><span>BEST</span></div><div class="stat"><b id="fGraze">0</b><span>GRAZES</span></div><div class="stat"><b id="fGems">0</b><span>GEMS</span></div></div>
    <button class="btn" id="fAgain">TRY AGAIN</button><button class="link" id="fMenu">Menu</button>
  </div>
  <button class="corner" id="mute" aria-label="Toggle sound">🔊</button>
</div>
<script>
/* ================= core ================= */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const KEY = 'orbdash:v2';
let save = { best: 0, gems: 0, skin: 'ember', owned: { ember: 1 }, muted: false, unlocked: 1, stars: {} };
try { const r = localStorage.getItem(KEY); if (r) save = Object.assign(save, JSON.parse(r)); } catch (e) {}
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

const cv = $('#cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
let PR = Math.min(devicePixelRatio || 1, innerWidth < 700 ? 1.6 : 2);
renderer.setPixelRatio(PR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, .1, 400);
scene.fog = new THREE.Fog(0x000000, 20, 95);
const hemi = new THREE.HemisphereLight(0xffffff, 0x222244, .6); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xffffff, .7); sunL.position.set(-3, 8, 4); scene.add(sunL);
let composer = null, bloom = null, useBloom = !!(THREE.EffectComposer && THREE.UnrealBloomPass);
if (useBloom) {
  try {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), .85, .5, .5);
    composer.addPass(bloom);
  } catch (e) { useBloom = false; composer = null; }
}

/* curved world: everything ahead bends by uCurve */
const curveU = { value: new THREE.Vector2(0, 0) };
const CURVE_GLSL = `
  vec4 mvPosition = vec4( transformed, 1.0 );
  #ifdef USE_INSTANCING
    mvPosition = instanceMatrix * mvPosition;
  #endif
  vec4 cwp = modelMatrix * mvPosition;
  float cz = min(cwp.z, 0.0);
  cwp.x += uCurve.x * cz * cz; cwp.y += uCurve.y * cz * cz;
  mvPosition = viewMatrix * cwp;
  gl_Position = projectionMatrix * mvPosition;`;
function curved(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uCurve = curveU;
    sh.vertexShader = 'uniform vec2 uCurve;\n' + sh.vertexShader.replace('#include <project_vertex>', CURVE_GLSL);
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n#ifdef USE_COLOR\n totalEmissiveRadiance *= vColor;\n#endif');
  };
  mat.customProgramCacheKey = () => 'curved';
  return mat;
}
const CURVE_FN = `uniform vec2 uCurve; vec4 bend(vec4 w){ float cz = min(w.z,0.0); w.x += uCurve.x*cz*cz; w.y += uCurve.y*cz*cz; return w; }`;
const NOISE_GLSL = `

const bubble = new THREE.Mesh(new THREE.SphereGeometry(R * 1.9, 24, 16), new THREE.MeshBasicMaterial({ color: '#2ef2ff', transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false }));
const bubbleW = new THREE.Mesh(new THREE.IcosahedronGeometry(R * 1.95, 1), new THREE.MeshBasicMaterial({ color: '#bff8ff', wireframe: true, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false }));
ball.add(bubble); ball.add(bubbleW);
const odAura = glow(0xffc23d, 2.6, 0); ball.add(odAura);
/* overdrive */
function addMeter(v) { if (RUN.odT > 0) return; RUN.od = Math.min(1, RUN.od + v); if (RUN.od >= 1 && !RUN.odReady) { RUN.odReady = true; AU.zoneUp(); tip('overdrive'); } renderMeter(); }
function renderMeter() { $('#odfill').style.width = (RUN.odT > 0 ? RUN.odT / 3.5 : RUN.od) * 100 + '%'; $('#odbtn').classList.toggle('ready', RUN.odReady && RUN.odT <= 0 && RUN.state === 'play'); $('#odwrap').classList.toggle('live', RUN.odT > 0); }
function triggerOD() {
  if (!RUN.odReady || RUN.odT > 0 || RUN.state !== 'play') return;
  RUN.odReady = false; RUN.od = 0; RUN.odT = 3.5; RUN.odSlow = .45; flash(); shake(.35); AU.overdrive();
  banner('', 'OVERDRIVE', 'Smash through everything · x2 points', '#ffc23d'); if (navigator.vibrate) navigator.vibrate([30, 30, 60]);
  ballU.a.value.set('#ff9a00'); ballU.b.value.set('#fff27a'); ballU.rim.value.set('#ffffff'); ballU.hue.value = 0;
  renderMeter();
}
function endOD() { applySkin(); renderMeter(); }
function smash(o) {
  burst(new THREE.Vector3(o.x, .6, o.z), pal.ob.getHex(), 22, 9); burst(new THREE.Vector3(o.x, .6, o.z), 0xffc23d, 10, 6);
  world.remove(o.g); disposeObj(o.g); obs.splice(obs.indexOf(o), 1);
  const pts = 50 * RUN.combo; RUN.score += pts; pop(`SMASH +${pts}`, '#ffc23d', new THREE.Vector3(RUN.bx, 1.2, 0)); AU.boom(); shake(.2);
}
/* first-time tips */
const TIPS = {
  steer: { i: '👆', t: 'Hold & slide', s: 'Drag left and right to steer the orb' },
  graze: { i: '⚡', t: 'Graze for points', s: 'Pass close to obstacles without touching them. Chain grazes for combos' },
  gem: { i: '◆', t: 'Grab gems', s: 'Gems unlock new orbs in the menu' },
  power: { i: '🛡️', t: 'Power-ups', s: 'Shield saves you once · Magnet pulls gems · Slow-mo buys time' },
  overdrive: { i: '🔥', t: 'OVERDRIVE ready!', s: 'Tap the glowing button to smash through everything' }
};
let tipT = null;
function tip(k, force) {
  save.tips = save.tips || {};
  if (save.tips[k] && !force) return; save.tips[k] = 1; store();
  const T_ = TIPS[k], el = $('#tip');
  el.innerHTML = `<div class="ti">${T_.i}</div><div><b>${T_.t}</b><span>${T_.s}</span></div>${k === 'steer' ? '<div class="hand">👆</div>' : ''}`;
  el.classList.add('show'); clearTimeout(tipT); tipT = setTimeout(() => el.classList.remove('show'), k === 'steer' ? 4200 : 3600);
}
$('#odbtn').addEventListener('pointerdown', e => { e.stopPropagation(); triggerOD(); });
addEventListener('keydown', e => { if (e.key === 'Shift' || e.key === 'f' || e.key === 'F') triggerOD(); });
AU.zoneUp = function () { if (!this.ctx) return; const t = this.ctx.currentTime; [440, 554, 659, 880].forEach((f, i) => this.osc(f, t + i * .06, 'square', .05, .18)); };
AU.overdrive = function () { if (!this.ctx) return; const t = this.ctx.currentTime; this.osc(110, t, 'sawtooth', .25, .8, null, 880); this.nz(t, 'highpass', 2000, .2, .5); };
AU.shieldHit = function () { if (!this.ctx) return; const t = this.ctx.currentTime; this.osc(880, t, 'triangle', .2, .4, null, 220); };
